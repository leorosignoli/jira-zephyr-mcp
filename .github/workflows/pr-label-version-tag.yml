# When a PR to main is merged and has one of these labels, create the next semver tag
# from the latest matching tag on the repo (merge commit is tagged).
#
# Labels (create under Issues → Labels). Names are matched exactly; aliases below also work:
#   major bump: tag-major | semver-major | release-major
#   minor bump: tag-minor | semver-minor | release-minor
#   patch bump: tag-patch | semver-patch | release-patch | patch-minor
#
# If more than one label is present, precedence is: tag-major > tag-minor > tag-patch.
# If none of these labels are on the merged PR, this workflow does nothing.
#
# Docker release: pushes made with the default GITHUB_TOKEN do NOT trigger other workflows
# (see GitHub docs: triggering a workflow from a workflow). Set repo secret GH_TOKEN to a
# PAT with contents:write so git push here starts docker-release.yml on the new tag.
#
# Fork PRs are skipped (no contents: write on untrusted code).
name: Version tag from PR label

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version bump from labels
        id: bump
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          BUMP=$(echo "$LABELS_JSON" | jq -r '
            def has($n): any(.[]; .name == $n);
            if has("tag-major") or has("semver-major") or has("release-major") then "major"
            elif has("tag-minor") or has("semver-minor") or has("release-minor") then "minor"
            elif has("tag-patch") or has("semver-patch") or has("release-patch") or has("patch-minor") then "patch"
            else empty
            end
          ')
          if [ -z "${BUMP:-}" ]; then
            echo "No release bump label — skipping (need tag-major/tag-minor/tag-patch or aliases; see workflow header)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Warn if GH_TOKEN missing (Docker release will not auto-run)
        if: steps.bump.outputs.skip == 'false'
        env:
          HAS_GH_PAT: ${{ secrets.GH_TOKEN != '' }}
        run: |
          if [ "$HAS_GH_PAT" != "true" ]; then
            echo "::warning::GH_TOKEN secret is not set. Tag push uses github.token, which does NOT trigger docker-release.yml. Add a PAT with contents:write as GH_TOKEN, or run Actions → Docker (release) with your new tag."
          fi

      - name: Checkout merge commit
        if: steps.bump.outputs.skip == 'false'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next tag and push
        if: steps.bump.outputs.skip == 'false'
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # PAT required for tag push to trigger docker-release.yml; GITHUB_TOKEN pushes are ignored for downstream workflows.
          PUSH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          LATEST=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)

          if [ -z "$LATEST" ]; then
            case "$BUMP" in
              major) NEW_TAG=v1.0.0 ;;
              minor) NEW_TAG=v0.1.0 ;;
              patch) NEW_TAG=v0.0.1 ;;
            esac
          else
            ver=${LATEST#v}
            IFS=. read -r maj min pat <<< "$ver"
            # Base-10 so leading zeros (e.g. 08) are not parsed as octal.
            case "$BUMP" in
              major) NEW_TAG="v$((10#$maj + 1)).0.0" ;;
              minor) NEW_TAG="v${maj}.$((10#$min + 1)).0" ;;
              patch) NEW_TAG="v${maj}.${min}.$((10#$pat + 1))" ;;
            esac
          fi

          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists — refusing to overwrite."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEW_TAG" -m "chore(release): $NEW_TAG (PR #${PR_NUMBER})"

          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "$NEW_TAG"

          echo "Created and pushed $NEW_TAG"
